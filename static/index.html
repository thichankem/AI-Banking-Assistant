<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietcombank AI Banking Assistant v4.5</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <!-- HEADER -->
        <header class="chat-header">
            <div class="header-left">
                <h2>Vietcombank AI Banking Assistant</h2>
            </div>
            <div class="header-right">
                <button type="button" id="clearChatBtn" class="btn-reset">
                    Làm mới phiên
                </button>
            </div>
        </header>

        <div class="stepper-container" id="nodeStepper" style="display: none;">
            <div class="stepper-header">
                <span class="stepper-title">Agent ReAct</span>
                <span class="stepper-current-desc" id="stepperDesc" role="status"></span>
            </div>
            <ul id="agentActions" class="agent-actions" aria-label="Hành động của agent"></ul>
        </div>

        <!-- CHAT MESSAGES -->
        <main class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="bubble">
                    <p>Kính chào Quý khách! Tôi là <strong>Trợ lý AI chuyên trách của Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)</strong>.</p>
                    <p>Quý khách cần hỗ trợ thông tin gì hôm nay ạ?</p>
                </div>
            </div>
        </main>

        <!-- CHAT INPUT -->
        <form class="chat-input-area" id="chatForm">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Hỏi về biểu phí, mở thẻ, vay mua nhà, kiểm tra sinh trắc học QĐ 2345..." 
                autocomplete="off" 
                required
            >
            <button type="submit" id="sendBtn">Gửi</button>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
