[project]
name = "ai-banking-assistant"
version = "0.1.0"
description = "AI Banking Assistant with High-Performance RAG and Tool Calling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "openai>=1.40.0",
    "qdrant-client>=1.19.0",
    "arize-phoenix>=20.0.0",
    "openinference-semantic-conventions>=0.1.0",
    "python-docx>=1.2.0",
    "tokenizers>=0.23.0",
    "regex>=2024.11.6",
    "PyMuPDF>=1.26.0,<2",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langgraph>=1.2.17,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
