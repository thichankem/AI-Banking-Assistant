[project]
name = "ai-banking-assistant"
version = "0.1.0"
description = "AI Banking Assistant with High-Performance RAG and Tool Calling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "openai>=3.58.0",
    "httpx>=0.28.1",
    "qdrant-client>=1.20.0",
    "langsmith>=0.16.1",
    "langchain-core>=1.8.4",
    "python-docx>=1.2.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "tokenizers>=0.23.3",
    "regex>=2026.11.23",
    "PyMuPDF>=2.1,<3",
    "Pillow>=13.0.0",
    "numpy>=2.4.6",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.4",
    "langgraph>=1.2.24,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0.4,<7",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv]
package = false
