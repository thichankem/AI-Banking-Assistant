name: calculate_savings_profit
title: Tính Lãi Tiền Gửi Tiết Kiệm
description: Ước tính lãi và tổng tiền đáo hạn theo lãi suất mẫu. Kết quả là mô phỏng.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    amount_vnd:
      type: number
      description: 'Số tiền gửi tiết kiệm bằng VNĐ (Ví dụ: 100000000 là 100 triệu
        VNĐ)'
    term_months:
      type: integer
      description: 'Kỳ hạn gửi tiết kiệm tính theo tháng (Ví dụ: 1, 3, 6, 12, 24 tháng)'
  required:
  - amount_vnd
  - term_months
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    principal_amount_vnd:
      type: number
    term_months:
      type: integer
    applicable_rate_percent:
      type: number
    interest_earned_vnd:
      type: number
    total_at_maturity_vnd:
      type: number
    formatted_summary:
      type: string
  required:
  - status
  - principal_amount_vnd
  - term_months
  - applicable_rate_percent
  - interest_earned_vnd
  - total_at_maturity_vnd
  - formatted_summary
annotations:
  readOnlyHint: true
  destructiveHint: false
