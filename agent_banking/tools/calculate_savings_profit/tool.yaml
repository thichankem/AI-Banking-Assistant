name: calculate_savings_profit
title: Calculate Savings Deposit Interest
description: Estimate interest and total amount at maturity based on sample interest rates. Results are simulated.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    amount_vnd:
      type: number
      description: 'Savings deposit amount in VND (e.g., 100000000 is 100 million VND)'
    term_months:
      type: integer
      description: 'Savings deposit term in months (e.g., 1, 3, 6, 12, 24 months)'
  required:
  - amount_vnd
  - term_months
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    principal_amount_vnd:
      type: number
    term_months:
      type: integer
    applicable_rate_percent:
      type: number
    interest_earned_vnd:
      type: number
    total_at_maturity_vnd:
      type: number
    formatted_summary:
      type: string
  required:
  - status
  - principal_amount_vnd
  - term_months
  - applicable_rate_percent
  - interest_earned_vnd
  - total_at_maturity_vnd
  - formatted_summary
annotations:
  readOnlyHint: true
  destructiveHint: false
