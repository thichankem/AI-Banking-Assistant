name: rate_agent_csat
title: Rate Customer Satisfaction (CSAT)
description: Simulate response when customer rates satisfaction from 1 to 5 stars.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    rating_score:
      type: integer
      description: Rating score from 1 to 5
      minimum: 1
      maximum: 5
    user_message:
      type: string
      default: ''
      description: Additional feedback or comments from the customer
    channel:
      type: string
      default: web
      description: Customer interaction channel
  required:
  - rating_score
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    rating_score:
      type: integer
    comment:
      type: string
    channel:
      type: string
    final_answer:
      type: string
  required:
  - status
  - rating_score
  - comment
  - channel
  - final_answer
annotations:
  readOnlyHint: false
  destructiveHint: false
