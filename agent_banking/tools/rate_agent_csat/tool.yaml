name: rate_agent_csat
title: Đánh Giá Mức Độ Hài Lòng CSAT
description: Mô phỏng phản hồi khi khách đánh giá độ hài lòng từ 1 đến 5 sao.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    rating_score:
      type: integer
      description: Điểm đánh giá từ 1 đến 5
      minimum: 1
      maximum: 5
    user_message:
      type: string
      default: ''
      description: Ý kiến đóng góp thêm của khách hàng
    channel:
      type: string
      default: web
      description: Kênh tương tác của khách hàng
  required:
  - rating_score
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    rating_score:
      type: integer
    comment:
      type: string
    channel:
      type: string
    final_answer:
      type: string
  required:
  - status
  - rating_score
  - comment
  - channel
  - final_answer
annotations:
  readOnlyHint: false
  destructiveHint: false
