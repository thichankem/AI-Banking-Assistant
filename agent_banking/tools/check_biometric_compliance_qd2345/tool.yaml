name: check_biometric_compliance_qd2345
title: Biometric Compliance Audit QĐ 2345 & TT 50
description: Audit mandatory biometric facial authentication (Facepay) matched with chip-embedded CCCD
  via NFC according to Decision 2345/QĐ-NHNN and Circular 50/2024/TT-NHNN when transactions exceed
  10 million/transaction or daily cumulative total exceeds 20 million.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    single_tx_amount_vnd:
      type: number
      default: 0.0
      description: Amount of the current transaction being initiated (VND)
    daily_cumulative_amount_vnd:
      type: number
      default: 0.0
      description: Total successfully accumulated transaction amount earlier today (VND)
    is_first_time_new_device:
      type: boolean
      default: false
      description: Whether this is the first transaction on a new, previously unregistered device
    has_verified_chip_cccd:
      type: boolean
      default: true
      description: Whether the customer has completed chip-embedded CCCD verification via NFC on A-Bank Plus
  required:
  - single_tx_amount_vnd
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    regulation_reference:
      type: string
    single_tx_amount_vnd:
      type: number
    daily_cumulative_amount_vnd:
      type: number
    requires_biometric:
      type: boolean
    has_verified_chip_cccd:
      type: boolean
    can_proceed_immediately:
      type: boolean
    trigger_reasons:
      type: array
    mandatory_action:
      type: string
  required:
  - status
  - regulation_reference
  - single_tx_amount_vnd
  - daily_cumulative_amount_vnd
  - requires_biometric
  - has_verified_chip_cccd
  - can_proceed_immediately
  - trigger_reasons
  - mandatory_action
annotations:
  readOnlyHint: true
  destructiveHint: false
