name: deflect_competitor_comparison
title: Deflect Competitor Comparison
description: Deflect direct comparison questions regarding competitor banks (Techcombank,
  MB, VPBank...) towards the advantages and distinct policies of A-Bank.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    competitor_name:
      type: string
      default: ''
      description: Name of competitor bank mentioned by the customer
    query:
      type: string
      default: ''
      description: Initial question or comparison content from the customer
  required:
  - competitor_name
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    strategy:
      type: string
    directive:
      type: string
    competitor_mentioned:
      type: string
    original_query:
      type: string
  required:
  - status
  - strategy
  - directive
  - competitor_mentioned
  - original_query
annotations:
  readOnlyHint: true
  destructiveHint: false
