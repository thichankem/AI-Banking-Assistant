name: analyze_banking_query
title: Banking Query Analysis
description: Normalize inquiries, expand known banking abbreviations, flag potentially ambiguous meanings,
  and extract keywords, amounts, and document references. Returned fields provide data from the inquiry
  and search suggestions. RAG normalizes automatically during search.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    query:
      type: string
      minLength: 1
      maxLength: 500
      description: Banking inquiry or phrase to analyze.
  required:
  - query
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    raw_query:
      type: string
    normalized_query:
      type: string
    keywords_str:
      type: string
    intent:
      type: string
    sub_intent:
      type: string
    domain:
      type: string
    expanded_query:
      type: string
    keywords:
      type: array
    detected_acronyms:
      type: array
    legal_references:
      type: array
    financial_amounts:
      type: array
    banks_mentioned:
      type: array
    entities:
      type: array
    suggested_filters:
      type: object
    ambiguous_acronyms:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
  required:
  - raw_query
  - normalized_query
  - keywords_str
  - intent
  - sub_intent
  - domain
  - expanded_query
  - keywords
  - detected_acronyms
  - legal_references
  - financial_amounts
  - banks_mentioned
  - entities
  - suggested_filters
  - ambiguous_acronyms
annotations:
  readOnlyHint: true
  destructiveHint: false
