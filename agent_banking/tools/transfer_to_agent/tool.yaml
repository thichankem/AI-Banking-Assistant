name: transfer_to_agent
title: Transfer to Online Human Advisor
description: Simulate transfer status to human advisors based on sample working hours.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    business_process:
      type: string
      default: request_human_agent
      description: Business process or reason for forwarding to an advisor
    customer_segment:
      type: string
      default: individual
      description: Customer segment ('individual' or 'corporate')
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    handoff_status:
      type: string
    is_working_hour:
      type: boolean
    business_process:
      type: string
    customer_segment:
      type: string
    target_queue:
      type: string
    hotline:
      type: string
    customer_notice:
      type: string
  required:
  - status
  - handoff_status
  - is_working_hour
  - business_process
  - customer_segment
  - target_queue
  - hotline
  - customer_notice
annotations:
  readOnlyHint: false
  destructiveHint: false
