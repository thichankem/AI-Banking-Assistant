name: create_support_ticket
title: Create Incident Support & Dispute Ticket
description: Simulate incident support ticket code. Returned status is test data.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    customer_name:
      type: string
      description: Display name or alias for the simulated ticket.
    issue_type:
      type: string
      enum:
      - nuot_the_atm
      - mat_the_khoa_the
      - tra_soat_giao_dich
      - gian_lan_lua_dao
      - khac
      description: Incident category arising
    description:
      type: string
      description: Detailed incident content, ATM location, amount, or time of occurrence
    priority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
      default: NORMAL
      description: Bank processing priority level
  required:
  - customer_name
  - issue_type
  - description
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    ticket_id:
      type: string
    customer_name:
      type: string
    issue_type:
      type: string
    description:
      type: string
    priority:
      type: string
    created_at:
      type: string
    emergency_hotline:
      type: string
    message:
      type: string
  required:
  - status
  - ticket_id
  - customer_name
  - issue_type
  - description
  - priority
  - created_at
  - emergency_hotline
  - message
annotations:
  readOnlyHint: false
  destructiveHint: false
