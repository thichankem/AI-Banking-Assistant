name: search_banking_knowledge
title: Tra Cứu Tri Thức Quy Chế & Biểu Phí A-Bank (Agentic RAG)
description: Tra cứu tài liệu quy chế ngân hàng, sản phẩm thẻ, pháp lý tuân thủ, hướng
  dẫn app A-Bank Plus, bảo hiểm A-Life, tín dụng, báo cáo tài chính và SLA bằng công
  nghệ Hybrid Vector + BM25 và Cross-Encoder Reranker. Với bảng Excel, dùng excel
  để lọc điều kiện trên cùng một hàng và chọn phiên bản theo ngày hiệu lực.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    query:
      type: string
      description: Câu tìm kiếm tự chứa chủ đề, đối tượng và điều kiện còn áp dụng.
        Với câu nối tiếp, dùng đối tượng xác định được từ ngữ cảnh của phiên.
      minLength: 1
    exact:
      type: string
      minLength: 2
      maxLength: 100
      description: Nếu cần, tên sản phẩm hoặc mã dịch vụ phải xuất hiện trong kết
        quả.
    top_k:
      type: integer
      default: 3
      description: Số lượng tài liệu tinh lọc sau Rerank
      minimum: 1
      maximum: 6
    source:
      type: string
      minLength: 2
      maxLength: 400
      description: Tên nguồn đã tìm thấy, hoặc đường dẫn nguồn đầy đủ để giới hạn đúng tài liệu.
    offset:
      type: integer
      minimum: 0
      maximum: 10000
      description: Khi có source, đọc các đoạn liên tiếp theo thứ tự nguồn từ vị trí này, không rerank. Dùng next_offset để đọc tiếp hướng dẫn hoặc bảng bị chia đoạn.
    excel:
      type: object
      description: Tra theo hàng Excel. Tìm bảng trước với query và lấy excel_table_id trong business_metadata.
      additionalProperties: false
      required: [table_id]
      properties:
        table_id:
          type: string
          pattern: '^[0-9a-f]{24}$'
        as_of:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Ngày cần tra cứu theo YYYY-MM-DD.
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [column, op]
            properties:
              column: {type: string, minLength: 1, maxLength: 400}
              op: {enum: [eq, ne, gt, gte, lt, lte, is_blank]}
              value:
                type: [string, number, boolean]
                maxLength: 400
                description: Giá trị theo kiểu cột. Dùng ngày ISO và phần trăm theo điểm phần trăm, ví dụ 2.5 cho 2.5%.
              unit: {type: string, minLength: 1, maxLength: 16}
            if:
              properties:
                op: {const: is_blank}
            else:
              required: [value]
  required:
  - query
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    documents:
      type: array
      items:
        type: object
        properties:
          chunk_id: {type: string}
          source: {type: string}
          content: {type: string}
          business_metadata: {type: object}
        required: [chunk_id, source, content]
    related_documents:
      $ref: '#/properties/documents'
      description: Các đoạn liền kề có liên kết cùng mục hoặc cùng quy trình để bổ sung ngữ cảnh.
    sources:
      type: array
      items: {type: string}
    citations:
      type: array
      items:
        type: object
        properties:
          label: {type: string}
          source: {type: string}
          chunk_id: {type: string}
        required: [label, source, chunk_id]
    latency_ms:
      type: number
  required:
  - status
  - documents
  - sources
  - citations
  - latency_ms
annotations:
  readOnlyHint: true
  destructiveHint: false
