name: search_banking_knowledge
title: Search A-Bank Regulations & Fee Knowledge (Agentic RAG)
description: Search banking regulations, card products, compliance, A-Bank Plus app
  guides, A-Life insurance, credit, financial reports, and SLAs using Hybrid Vector
  + BM25 and Cross-Encoder Reranker. For Excel tables, use excel to filter conditions
  on the same row and choose versions by effective date.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    query:
      type: string
      description: Self-contained search query with topic, subject, and applicable conditions.
        For follow-up questions, use the subject determined from session context.
      minLength: 1
    exact:
      type: string
      minLength: 2
      maxLength: 100
      description: If needed, product name or service code that must appear in results.
    top_k:
      type: integer
      default: 3
      description: Number of refined documents after Rerank
      minimum: 1
      maximum: 6
    source:
      type: string
      minLength: 2
      maxLength: 400
      description: Source name, document code, or full indexed path. To search one category, use its full indexed folder, such as A_Bank/4. Hướng dẫn sử dụng app Digital for app navigation.
    offset:
      type: integer
      minimum: 0
      maximum: 10000
      description: Read consecutive chunks from a specific document without reranking. With page, offset and next_offset count chunks within that page. Omit offset for relevance searches and folder searches.
    page:
      type: integer
      minimum: 1
      maximum: 10000
      description: One-based PDF page to read from the specified document. If the page lacks the requested fact, check related_documents for same-source matches on other pages and cite where the evidence actually appears. Use a topic search in the same source if additional evidence is needed.
    excel:
      type: object
      description: Look up by Excel row. Find table first using query and obtain excel_table_id from business_metadata.
      additionalProperties: false
      required: [table_id]
      properties:
        table_id:
          type: string
          pattern: '^[0-9a-f]{24}$'
        as_of:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Target date for lookup in YYYY-MM-DD format.
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [column, op]
            properties:
              column: {type: string, minLength: 1, maxLength: 400}
              op: {enum: [eq, ne, gt, gte, lt, lte, is_blank]}
              value:
                type: [string, number, boolean]
                maxLength: 400
                description: Value matching column type. Use ISO dates and percentages in percentage points, e.g., 2.5 for 2.5%.
              unit: {type: string, minLength: 1, maxLength: 16}
            if:
              properties:
                op: {const: is_blank}
            else:
              required: [value]
  required:
  - query
  dependentRequired:
    page: [source]
  not:
    required: [page, excel]
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    documents:
      type: array
      items:
        type: object
        properties:
          chunk_id: {type: string}
          source: {type: string}
          content: {type: string}
          business_metadata: {type: object}
        required: [chunk_id, source, content]
    related_documents:
      $ref: '#/properties/documents'
      description: Adjacent chunks or chunks matching sections, tables, figures, and conditions of the inquiry to supplement.
    sources:
      type: array
      items: {type: string}
    citations:
      type: array
      items:
        type: object
        properties:
          label: {type: string}
          source: {type: string}
          chunk_id: {type: string}
        required: [label, source, chunk_id]
    latency_ms:
      type: number
  required:
  - status
  - documents
  - sources
  - citations
  - latency_ms
annotations:
  readOnlyHint: true
  destructiveHint: false
