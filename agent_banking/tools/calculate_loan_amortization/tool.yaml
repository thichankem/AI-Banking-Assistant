name: calculate_loan_amortization
title: Tính Lịch Trả Nợ Vay Dư Nợ Giảm Dần
description: Tính toán chi tiết lịch trả nợ vay ngân hàng A-Bank theo phương pháp
  dư nợ giảm dần từng tháng, bao gồm số tiền trả tháng đầu, tiền gốc, tiền lãi và
  tổng số tiền phải trả.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    principal_vnd:
      type: number
      description: 'Số tiền vay gốc bằng VNĐ (Ví dụ: 500000000 là 500 triệu VNĐ)'
    annual_rate_percent:
      type: number
      description: 'Lãi suất vay tính theo năm tính bằng phần trăm (Ví dụ: 7.5 là
        7.5%/năm)'
    term_months:
      type: integer
      description: 'Kỳ hạn vay tính bằng tháng (Ví dụ: 12, 24, 60 tháng)'
  required:
  - principal_vnd
  - annual_rate_percent
  - term_months
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    calculation_method:
      type: string
    principal_vnd:
      type: number
    annual_rate_percent:
      type: number
    term_months:
      type: integer
    first_month_payment_vnd:
      type: number
    total_interest_vnd:
      type: number
    total_payable_vnd:
      type: number
    schedule_sample:
      type: array
      items:
        type: object
        properties:
          month: {type: integer, minimum: 1}
          opening_balance_vnd: {type: number}
          principal_payment_vnd: {type: number}
          interest_payment_vnd: {type: number}
          total_monthly_payment_vnd: {type: number}
        required: [month, opening_balance_vnd, principal_payment_vnd, interest_payment_vnd, total_monthly_payment_vnd]
  required:
  - status
  - calculation_method
  - principal_vnd
  - annual_rate_percent
  - term_months
  - first_month_payment_vnd
  - total_interest_vnd
  - total_payable_vnd
  - schedule_sample
annotations:
  readOnlyHint: true
  destructiveHint: false
