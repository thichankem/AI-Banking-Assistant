name: calculate_loan_amortization
title: Calculate Declining Balance Loan Amortization Schedule
description: Detailed calculation of A-Bank loan repayment schedule under the monthly
  declining balance method, including first-month payment, principal, interest, and
  total payable amount.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    principal_vnd:
      type: number
      description: 'Loan principal amount in VND (e.g., 500000000 is 500 million VND)'
    annual_rate_percent:
      type: number
      description: 'Annual loan interest rate in percent (e.g., 7.5 is 7.5%/year)'
    term_months:
      type: integer
      description: 'Loan term in months (e.g., 12, 24, 60 months)'
  required:
  - principal_vnd
  - annual_rate_percent
  - term_months
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    calculation_method:
      type: string
    principal_vnd:
      type: number
    annual_rate_percent:
      type: number
    term_months:
      type: integer
    first_month_payment_vnd:
      type: number
    total_interest_vnd:
      type: number
    total_payable_vnd:
      type: number
    schedule_sample:
      type: array
      items:
        type: object
        properties:
          month: {type: integer, minimum: 1}
          opening_balance_vnd: {type: number}
          principal_payment_vnd: {type: number}
          interest_payment_vnd: {type: number}
          total_monthly_payment_vnd: {type: number}
        required: [month, opening_balance_vnd, principal_payment_vnd, interest_payment_vnd, total_monthly_payment_vnd]
  required:
  - status
  - calculation_method
  - principal_vnd
  - annual_rate_percent
  - term_months
  - first_month_payment_vnd
  - total_interest_vnd
  - total_payable_vnd
  - schedule_sample
annotations:
  readOnlyHint: true
  destructiveHint: false
