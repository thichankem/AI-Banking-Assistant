name: get_foreign_exchange_rates
title: Foreign Exchange Rate Lookup
description: Read sample foreign exchange rates for simulation. Does not represent
  official or real-time rates of A-Bank.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    currency:
      type: string
      default: USD
      description: Standard 3-character ISO currency code (USD, EUR, JPY, GBP, SGD,
        AUD, CAD, CNY). Leave empty to retrieve the entire exchange rate table.
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    effective_date:
      type: string
    bank:
      type: string
    rates:
      type: object
      additionalProperties:
        type: object
        properties:
          name: {type: string}
          buy_cash: {type: number}
          buy_transfer: {type: number}
          sell: {type: number}
        required: [name, buy_cash, buy_transfer, sell]
    note:
      type: string
  required:
  - status
  - effective_date
  - bank
  - rates
  - note
annotations:
  readOnlyHint: true
  destructiveHint: false
