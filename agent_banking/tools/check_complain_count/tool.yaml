name: check_complain_count
title: Complaint Frequency Control
description: Compute the next complaint count and determine if the threshold for proposing transfer to a human advisor is reached.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    complain_count:
      type: integer
      default: 0
      description: Number of complaints in the session
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    previous_count:
      type: integer
    complain_count:
      type: integer
    escalate_to_human:
      type: boolean
    message:
      type: string
  required:
  - status
  - previous_count
  - complain_count
  - escalate_to_human
  - message
annotations:
  readOnlyHint: true
  destructiveHint: false
