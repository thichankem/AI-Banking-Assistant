name: get_interest_rates
title: Published Deposit Interest Rate Lookup
description: Read sample deposit interest rates for simulation. Use A-Bank documents
  for official published rates.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    deposit_type:
      type: string
      enum:
      - vnd
      - usd
      default: vnd
      description: 'Savings deposit currency type: ''vnd'' (Vietnamese Dong) or ''usd''
        (US Dollar)'
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    currency:
      type: string
    effective_date:
      type: string
    bank:
      type: string
    interest_rates:
      type: array
      items:
        type: object
        properties:
          term: {type: string}
          rate_percent_per_year: {type: number}
          note: {type: string}
        required: [term, rate_percent_per_year, note]
    disclaimer:
      type: string
  required:
  - status
  - currency
  - effective_date
  - bank
  - interest_rates
  - disclaimer
annotations:
  readOnlyHint: true
  destructiveHint: false
