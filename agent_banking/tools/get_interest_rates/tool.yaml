name: get_interest_rates
title: Tra Cứu Bảng Lãi Suất Tiền Gửi Niêm Yết
description: Đọc lãi suất tiền gửi mẫu để mô phỏng. Dùng tài liệu A-Bank cho biểu
  niêm yết.
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    deposit_type:
      type: string
      enum:
      - vnd
      - usd
      default: vnd
      description: 'Loại đồng tiền gửi tiết kiệm: ''vnd'' (đồng Việt Nam) hoặc ''usd''
        (đô la Mỹ)'
  additionalProperties: false
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    status:
      type: string
    currency:
      type: string
    effective_date:
      type: string
    bank:
      type: string
    interest_rates:
      type: array
      items:
        type: object
        properties:
          term: {type: string}
          rate_percent_per_year: {type: number}
          note: {type: string}
        required: [term, rate_percent_per_year, note]
    disclaimer:
      type: string
  required:
  - status
  - currency
  - effective_date
  - bank
  - interest_rates
  - disclaimer
annotations:
  readOnlyHint: true
  destructiveHint: false
