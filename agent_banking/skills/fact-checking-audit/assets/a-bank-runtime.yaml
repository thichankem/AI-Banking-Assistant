parameters_schema:
  type: object
  properties:
    check_type:
      type: string
      enum:
      - grade_documents
      - audit_answer
      default: audit_answer
      description: 'Check mode: document grading or answer audit'
    query:
      type: string
      description: Query to cross-check
    documents:
      type: array
      description: List of extracted document chunks serving as evidence
    draft_answer:
      type: string
      description: Draft answer to check for hallucinations
output_schema:
  type: object
  properties:
    check_type:
      type: string
    is_relevant:
      type: boolean
    is_faithful:
      type: boolean
    has_citation:
      type: boolean
execution:
  type: fact_checker_engine
