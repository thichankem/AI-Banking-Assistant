parameters_schema:
  type: object
  properties:
    check_type:
      type: string
      enum:
      - grade_documents
      - audit_answer
      default: audit_answer
      description: 'Chế độ kiểm tra: thẩm định tài liệu hoặc đối soát câu trả lời'
    query:
      type: string
      description: Câu hỏi cần đối chiếu
    documents:
      type: array
      description: Danh sách các chunks tài liệu trích xuất làm căn cứ
    draft_answer:
      type: string
      description: Câu trả lời dự thảo cần kiểm tra ảo giác
output_schema:
  type: object
  properties:
    check_type:
      type: string
    is_relevant:
      type: boolean
    is_faithful:
      type: boolean
    has_citation:
      type: boolean
execution:
  type: fact_checker_engine
