parameters_schema:
  type: object
  properties:
    query:
      type: string
      description: Self-contained search query with topic, subject, and applicable conditions.
        For follow-up questions, use the subject determined from session context.
    top_k:
      type: integer
      default: 3
      minimum: 1
      maximum: 6
      description: Number of most accurate text chunks after Rerank
    exact:
      type: string
      minLength: 2
      maxLength: 100
    candidate_k:
      type: integer
      default: 30
      minimum: 1
      maximum: 80
      description: Initial number of candidate passages collected from Hybrid Retrieval
  required:
  - query
output_schema:
  type: object
  properties:
    chunks:
      type: array
    formatted_context:
      type: string
    citations:
      type: array
    sources:
      type: array
    query_used:
      type: string
execution:
  type: rag_pipeline
