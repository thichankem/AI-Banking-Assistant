parameters_schema:
  type: object
  properties:
    issue_type:
      type: string
      enum:
      - nuot_the_atm
      - mat_the_khoa_the
      - tra_soat_giao_dich
      - gian_lan_lua_dao
      default: tra_soat_giao_dich
      description: Banking incident classification
    user_contact:
      type: string
      default: KHACH_HANG_HOTLINE
      description: Customer phone number or contact information
    card_number:
      type: string
      default: ''
      description: Card number or account number involved in the incident
    details:
      type: string
      default: Tiếp nhận từ trợ lý AI.
      description: Detailed description of the incident, location, and time
    urgency:
      type: string
      enum:
      - NORMAL
      - HIGH
      - CRITICAL
      default: HIGH
      description: Urgency level of the incident
output_schema:
  type: object
  properties:
    ticket_info:
      type: object
    immediate_action_guide:
      type: string
    hotline_support:
      type: string
execution:
  type: incident_dispatcher
  function: create_support_ticket
  hotline: 1900 6688 (24/7)
