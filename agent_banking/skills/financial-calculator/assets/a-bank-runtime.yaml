parameters_schema:
  type: object
  properties:
    operation:
      type: string
      enum:
      - auto
      - loan_amortization
      - savings_profit
      - fx_rates
      - interest_rates
      default: auto
      description: Calculation or lookup operation type
    raw_text:
      type: string
      description: Raw inquiry text for automatic extraction of financial parameters
    principal:
      type: number
      description: Principal amount (VND) for loan or savings deposit
      default: 100000000.0
    annual_rate_percent:
      type: number
      description: Annual interest rate (%/year)
      default: 7.5
    term_months:
      type: integer
      description: Loan or savings deposit term (months)
      default: 12
    currency:
      type: string
      description: Foreign currency code for exchange rate lookup (USD, EUR, JPY...)
      default: USD
    deposit_type:
      type: string
      description: Deposit currency type for interest rate lookup ('vnd' or 'usd')
      default: vnd
output_schema:
  type: object
  properties:
    operation:
      type: string
    calculation_data:
      type: object
    rates_data:
      type: object
execution:
  type: financial_dispatcher
  operations:
    loan_amortization:
      function: calculate_loan_amortization
      arg_mapping:
        principal_vnd: principal
        annual_rate_percent: annual_rate_percent
        term_months: term_months
    savings_profit:
      function: calculate_savings_profit
      arg_mapping:
        amount_vnd: principal
        term_months: term_months
    fx_rates:
      function: get_foreign_exchange_rates
      arg_mapping:
        currency: currency
    interest_rates:
      function: get_interest_rates
      arg_mapping:
        deposit_type: deposit_type
